  <text x="32" y="82" class="mono" font-size="17" fill="#92A6B8">CONCEPT MAP · NOT LIVE DATA</text>
  <g fill="#151F2C" stroke="#344454">
    <rect x="32" y="112" width="576" height="62" rx="8"/>
