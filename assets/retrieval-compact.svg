<svg xmlns="http://www.w3.org/2000/svg" width="640" height="670" viewBox="0 0 640 670" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Archon-KB — Retrieval with provenance</title>
  <desc id="desc">Exact identifiers, lexical search and vector search feed rank fusion, followed by entity context and source evidence. Conceptual architecture, not live data.</desc>
